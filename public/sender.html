<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Throw Controller Dynamic</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .btn {
      padding: 24px 48px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #FF416C, #FF4B2B);
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(255, 75, 43, 0.5);
    }
    #status {
      margin-top: 24px;
      font-size: 1rem;
      color: #8b949e;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <button id="startBtn" class="btn">センサーを起動する</button>
  <div id="status">ボタンを押して振り動作を有効化してください</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    let isCoolingDown = false;
    const THRESHOLD = 20;

    startBtn.addEventListener('click', async () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission === 'granted') initSensor();
          else status.textContent = 'アクセスが拒否されました';
        } catch (err) { status.textContent = 'エラー: ' + err.message; }
      } else {
        initSensor();
      }
    });

    function initSensor() {
      startBtn.style.display = 'none';
      status.textContent = '左右に角度をつけて投げ分けてみてください！';

      window.addEventListener('devicemotion', (event) => {
        if (isCoolingDown) return;
        const acc = event.acceleration;
        if (!acc || acc.x === null) return;

        const totalAcc = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);

        if (totalAcc > THRESHOLD) {
          // X軸の加速度で左右判定 (画面向きにより調整)
          const angleX = acc.x; 
          let ballType = 'normal';
          
          if (totalAcc > 38) ballType = 'fireball';
          else if (Math.abs(angleX) > 12) ballType = 'curve';

          emitThrow(totalAcc, angleX, ballType);
        }
      });
    }

    async function emitThrow(power, angleX, ballType) {
      isCoolingDown = true;
      status.textContent = `【${ballType.toUpperCase()}】発射！ (Power: ${power.toFixed(1)})`;

      try {
        await fetch('/api/throw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ velocity: power, angle: angleX, type: ballType })
        });
      } catch (e) { console.error(e); }

      setTimeout(() => {
        isCoolingDown = false;
        status.textContent = '準備完了！iPhoneを振り抜いてください。';
      }, 700);
    }
  </script>
</body>
</html>
